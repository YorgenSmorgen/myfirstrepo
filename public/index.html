<script>
/*
  Storage for the planner.
  - If the Netlify Function at /api/store is deployed, everything is saved there (Netlify Blobs),
    so both of you share one plan. It can be locked with a passcode (PLANNER_PASSCODE env var).
  - If it isn't there (e.g. a drag-and-drop deploy), plans are saved in this browser on this device.
*/
(function () {
  var API = "/api/store", PASS = "wed-passcode", MODE = "wed-mode";

  // lucide-react's browser build looks for a lowercase `react` global
  try { Object.defineProperty(window, "react", { configurable: true, get: function () { return window.React; } }); } catch (e) {}

  var ls = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  var passHeader = function () { return encodeURIComponent(ls.get(PASS) || ""); };

  /* ── Shared storage (Netlify Function + Blobs) ── */
  function request(method, params, body) {
    var qs = new URLSearchParams(params || {}).toString();
    return fetch(API + (qs ? "?" + qs : ""), {
      method: method,
      cache: "no-store",
      body: body,
      keepalive: typeof body === "string" && body.length < 60000,
      headers: { "x-planner-key": passHeader(), "content-type": "text/plain;charset=UTF-8" }
    }).then(function (r) {
      if (r.status === 401) { ls.del(PASS); location.reload(); throw new Error("Passcode needed"); }
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }
  var cloud = {
    mode: "cloud",
    get: function (key) {
      return request("GET", { key: key }).then(function (d) { return typeof d.value === "string" ? { key: key, value: d.value, shared: true } : null; });
    },
    getMany: function (keys) {
      return request("GET", { keys: keys.join(",") }).then(function (d) { return d.values || {}; });
    },
    set: function (key, value) {
      return request("PUT", { key: key }, value).then(function () { return { key: key, value: value, shared: true }; });
    },
    "delete": function (key) {
      return request("DELETE", { key: key }).then(function () { return { key: key, deleted: true, shared: true }; });
    },
    list: function (prefix) {
      return request("GET", { prefix: prefix || "" }).then(function (d) { return { keys: d.keys || [], prefix: prefix, shared: true }; });
    }
  };

  /* ── This-device storage (IndexedDB, falling back to localStorage) ── */
  function openIDB() {
    return new Promise(function (res, rej) {
      if (!window.indexedDB) return rej(new Error("IndexedDB unavailable"));
      var r = indexedDB.open("wedding-planner", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("kv"); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function idbKV(db) {
    function run(mode, fn) {
      return new Promise(function (res, rej) {
        var t = db.transaction("kv", mode), q = fn(t.objectStore("kv"));
        t.oncomplete = function () { res(q.result); };
        t.onerror = function () { rej(t.error); };
        t.onabort = function () { rej(t.error || new Error("Transaction aborted")); };
      });
    }
    return {
      get: function (k) { return run("readonly", function (s) { return s.get(k); }); },
      set: function (k, v) { return run("readwrite", function (s) { return s.put(v, k); }); },
      del: function (k) { return run("readwrite", function (s) { return s["delete"](k); }); },
      keys: function () { return run("readonly", function (s) { return s.getAllKeys(); }); }
    };
  }
  function lsKV() {
    var P = "wedkv:";
    return {
      get: function (k) { return Promise.resolve(ls.get(P + k)); },
      set: function (k, v) { return new Promise(function (res, rej) { try { localStorage.setItem(P + k, v); res(); } catch (e) { rej(e); } }); },
      del: function (k) { ls.del(P + k); return Promise.resolve(); },
      keys: function () {
        var out = [];
        try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf(P) === 0) out.push(k.slice(P.length)); } } catch (e) {}
        return Promise.resolve(out);
      }
    };
  }
  function makeLocal(kv) {
    return {
      mode: "local",
      get: function (key) { return kv.get(key).then(function (v) { return typeof v === "string" ? { key: key, value: v, shared: true } : null; }); },
      getMany: function (keys) {
        return Promise.all(keys.map(function (k) { return kv.get(k); })).then(function (vals) {
          var o = {}; keys.forEach(function (k, i) { o[k] = typeof vals[i] === "string" ? vals[i] : null; }); return o;
        });
      },
      set: function (key, value) { return kv.set(key, value).then(function () { return { key: key, value: value, shared: true }; }); },
      "delete": function (key) { return kv.del(key).then(function () { return { key: key, deleted: true, shared: true }; }); },
      list: function (prefix) {
        return kv.keys().then(function (ks) {
          return { keys: ks.map(String).filter(function (k) { return k.indexOf(prefix || "") === 0; }), prefix: prefix, shared: true };
        });
      }
    };
  }

  /* ── Work out which storage to use ── */
  function probe() {
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 12000);
    return fetch(API + "?probe=1", { cache: "no-store", headers: { "x-planner-key": passHeader() }, signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) {
        clearTimeout(timer);
        if (r.status === 401) return { state: "locked" };
        var isJson = (r.headers.get("content-type") || "").indexOf("json") >= 0;
        if (r.ok && isJson) return r.json().then(function (d) { return { state: "cloud", protected: !!d["protected"] }; });
        if (r.status === 404 || r.ok) return { state: "local" };
        return { state: "cloud" }; // function exists but is failing: stay on shared storage so plans never split
      })
      .catch(function () { clearTimeout(timer); return { state: ls.get(MODE) === "cloud" ? "cloud" : "local" }; });
  }

  var attempts = 0;
  function gate(retry) {
    ls.del(PASS);
    var root = document.getElementById("root");
    root.innerHTML =
      '<div class="gate"><form class="gate-card">' +
      '<div class="gate-ico">💍</div><h1>Our wedding planner</h1>' +
      '<p>Enter your passcode to open your plans.</p>' +
      '<input type="password" autocomplete="current-password" placeholder="Passcode" aria-label="Passcode" required />' +
      '<div class="gate-err">' + (attempts ? "That passcode didn’t work. Try again." : "") + '</div>' +
      '<button type="submit">Open planner</button></form></div>';
    var form = root.querySelector("form"), input = form.querySelector("input"), btn = form.querySelector("button");
    try { input.focus(); } catch (e) {}
    form.onsubmit = function (e) {
      e.preventDefault();
      var v = input.value.trim();
      if (!v) return;
      ls.set(PASS, v);
      attempts++;
      btn.disabled = true;
      btn.textContent = "Checking…";
      retry();
    };
  }

  function ready(st, info) {
    st.passProtected = !!(info && info["protected"]);
    st.signOut = function () { ls.del(PASS); location.reload(); };
    window.storage = st;
    if (st.mode === "cloud") ls.set(MODE, "cloud");
    if (st.mode === "local" && navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function () {}); }
  }

  window.plannerReady = new Promise(function (resolve) {
    function start() {
      probe().then(function (p) {
        if (p.state === "locked") return gate(start);
        if (p.state === "cloud") { ready(cloud, p); return resolve(); }
        openIDB().then(idbKV, function () { return lsKV(); }).then(function (kv) { ready(makeLocal(kv), p); resolve(); });
      });
    }
    start();
  });
})();
</script>

/* ───────── context & primitives ───────── */
const Ctx = createContext(null);
const useApp = () => useContext(Ctx);
const Card = ({ className = "", children, style, onClick }) => <div className={`wp-card ${className}`} style={style} onClick={onClick}>{children}</div>;
const Btn = ({ kind = "primary", className = "", children, ...p }) => <button className={`wp-btn wp-btn-${kind} ${className}`} {...p}>{children}</button>;
const Field = ({ label, hint, children, className = "" }) => (
  <label className={`block ${className}`}><span className="wp-label">{label}</span>{children}{hint && <span className="block text-xs wp-mut mt-1 leading-snug">{hint}</span>}</label>
);
const Seg = ({ value, onChange, options }) => (
  <div className="wp-seg">{options.map(([v, l]) => <button key={v} className={value === v ? "on" : ""} onClick={() => onChange(v)}>{l}</button>)}</div>
);
const Bar = ({ v, color = "var(--sage)", h = 6, v2, color2 }) => (
  <div className="wp-bar" style={{ height: h }}>
    {v2 != null && <span style={{ width: `${Math.min(100, Math.max(0, v2 * 100))}%`, background: color2 }} />}
    <span style={{ width: `${Math.min(100, Math.max(0, v * 100))}%`, background: color }} />
  </div>
);
const Donut = ({ parts, size = 150, thick = 18, children }) => {
  const total = parts.reduce((a, p) => a + Math.max(0, p.v), 0);
  let acc = 0;
  const stops = total > 0 ? parts.filter((p) => p.v > 0).map((p) => { const s = (acc / total) * 360; acc += p.v; return `${p.c} ${s}deg ${(acc / total) * 360}deg`; }).join(",") : "#EEE8DE 0deg 360deg";
  return (
    <div style={{ width: size, height: size, borderRadius: "50%", background: `conic-gradient(${stops})`, position: "relative", flexShrink: 0 }}>
      <div style={{ position: "absolute", inset: thick, borderRadius: "50%", background: "#fff", display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", textAlign: "center" }}>{children}</div>
    </div>
  );
};
const Ring = ({ pct, size = 64, stroke = 6, children }) => {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return (
    <div style={{ width: size, height: size, position: "relative", flexShrink: 0 }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={size / 2} cy={size / 2} r={r} stroke="rgba(255,255,255,.18)" strokeWidth={stroke} fill="none" />
        <circle cx={size / 2} cy={size / 2} r={r} stroke="#EBD6A8" strokeWidth={stroke} fill="none" strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c * (1 - Math.min(1, Math.max(0, pct)))} style={{ transition: "stroke-dashoffset .9s ease" }} />
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>{children}</div>
    </div>
  );
};
const Empty = ({ icon, title, text, children }) => (
  <div className="text-center py-10 px-4">
    <div className="mx-auto mb-3 flex items-center justify-center" style={{ width: 56, height: 56, borderRadius: 999, background: "var(--gl)", color: "var(--gd)" }}><Ic n={icon} size={24} /></div>
    <div className="serif text-2xl font-semibold">{title}</div>
    {text && <p className="text-sm wp-mut mt-1 max-w-sm mx-auto">{text}</p>}
    {children && <div className="mt-4 flex justify-center gap-2 flex-wrap">{children}</div>}
  </div>
);
const Stars = ({ value = 0, onChange, size = 16 }) => (
  <div className="flex">{[1, 2, 3, 4, 5].map((n) => (
    <button key={n} type="button" style={{ padding: 1 }} onClick={(e) => { e.stopPropagation(); onChange && onChange(n === value ? 0 : n); }} aria-label={`${n} stars`}>
      <Ic n="Star" size={size} fill={n <= value ? "#D4A857" : "none"} color={n <= value ? "#D4A857" : "#CFC7B8"} />
    </button>))}
  </div>
);
const Leaf = ({ style, className = "" }) => (
  <svg viewBox="0 0 200 200" className={className} style={style} fill="none" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round">
    <path d="M18 186 C 60 140, 110 90, 186 16" />
    {[[46, 156, -100], [64, 136, 10], [82, 118, -100], [100, 100, 10], [118, 82, -100], [136, 64, 10], [154, 46, -100], [170, 30, 10]].map(([x, y, r], k) => (
      <path key={k} d="M0 0 C 8 -10, 26 -10, 34 0 C 26 10, 8 10, 0 0 Z" transform={`translate(${x} ${y}) rotate(${r})`} />
    ))}
  </svg>
);
const PageHead = ({ title, sub, children }) => (
  <div className="flex items-end justify-between gap-3 mb-5 flex-wrap">
    <div className="min-w-0">
      <h1 className="serif text-4xl md:text-5xl font-semibold leading-none">{title}</h1>
      {sub && <p className="wp-mut text-sm mt-2">{sub}</p>}
    </div>
    {children && <div className="flex items-center gap-2 flex-wrap">{children}</div>}
  </div>
);
const CardHead = ({ title, action, onAction, children }) => (
  <div className="flex items-center justify-between gap-2 mb-3">
    <h2 className="serif text-2xl font-semibold leading-tight">{title}</h2>
    {children}
    {action && <button className="text-sm flex items-center gap-0.5 wp-link" onClick={onAction}>{action}<Ic n="ChevronRight" size={15} /></button>}
  </div>
);
const Legend = ({ c, l, v, strong, red, border }) => (
  <div className="flex items-center gap-2">
    {c && <span style={{ width: 10, height: 10, borderRadius: 3, background: c, border: border ? "1px solid #C9D6CD" : "none", flexShrink: 0 }} />}
    <span className={`flex-1 ${strong ? "font-medium" : "wp-mut"}`}>{l}</span>
    <span className={`num ${strong ? "font-semibold" : ""}`} style={{ color: red ? "var(--red)" : undefined }}>{v}</span>
  </div>
);
const Stat = ({ icon, label, value, sub, warn, bar, onClick, tone }) => {
  const Tag = onClick ? "button" : "div";
  return (
    <Tag onClick={onClick} className={`wp-card ${onClick ? "hov" : ""} text-left p-4 flex flex-col gap-2 w-full min-w-0`}>
      <div className="flex items-center justify-between gap-2">
        <span className="text-xs uppercase tracking-wider wp-mut truncate">{label}</span>
        <span className="wp-ico" data-tone={tone || "sage"}><Ic n={icon} size={15} /></span>
      </div>
      <div className="serif text-2xl md:text-3xl font-semibold leading-none num truncate" style={{ color: warn ? "var(--red)" : undefined }}>{value}</div>
      {bar != null && <Bar v={bar} color={warn ? "var(--red)" : "var(--sage)"} />}
      {sub && <div className="text-xs truncate" style={{ color: warn ? "var(--red)" : "var(--mut)" }}>{sub}</div>}
    </Tag>
  );
};
const MoneyInput = ({ value, onChange, placeholder = "0", allowNeg }) => {
  const { db } = useApp();
  return (
    <div className="relative">
      <span className="absolute text-sm wp-mut" style={{ left: 12, top: "50%", transform: "translateY(-50%)" }}>{(CUR[db.settings.currency] || db.settings.currency + " ").trim()}</span>
      <input type="number" inputMode="decimal" step="any" min={allowNeg ? undefined : "0"} className="wp-input num" style={{ paddingLeft: 46 }} value={value} onChange={onChange} placeholder={placeholder} />
    </div>
  );
};
function Modal({ onClose, title, subtitle, children, footer, maxWidth }) {
  useEffect(() => {
    const k = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", k);
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => { window.removeEventListener("keydown", k); document.body.style.overflow = prev; };
  }, []);
  return (
    <div className="wp-overlay" onMouseDown={(e) => e.target === e.currentTarget && onClose()}>
      <div className="wp-sheet" style={maxWidth ? { maxWidth } : undefined}>
        <div className="md:hidden flex justify-center pt-2"><span style={{ width: 40, height: 4, borderRadius: 4, background: "#D8D1C5" }} /></div>
        <div className="flex items-center justify-between gap-3 px-5 pt-3 pb-3" style={{ borderBottom: "1px solid var(--line)" }}>
          <div className="min-w-0">
            <h3 className="serif text-2xl font-semibold truncate">{title}</h3>
            {subtitle && <p className="text-xs wp-mut">{subtitle}</p>}
          </div>
          <button className="wp-icon-btn" onClick={onClose} aria-label="Close"><Ic n="X" /></button>
        </div>
        <div className="wp-sheet-body flex-1">{children}</div>
        {footer && <div className="px-5 pt-3 flex items-center gap-2 flex-wrap" style={{ borderTop: "1px solid var(--line)", paddingBottom: "calc(.8rem + env(safe-area-inset-bottom))" }}>{footer}</div>}
      </div>
    </div>
  );
}
function Confirm({ box, onClose }) {
  if (!box) return null;
  return (
    <div className="wp-overlay" style={{ zIndex: 90 }} onMouseDown={(e) => e.target === e.currentTarget && onClose()}>
      <div className="wp-sheet" style={{ maxWidth: 430 }}>
        <div className="p-6" style={{ paddingBottom: "calc(1.5rem + env(safe-area-inset-bottom))" }}>
          <h3 className="serif text-2xl font-semibold mb-2">{box.title || "Are you sure?"}</h3>
          {box.msg && <p className="wp-mut text-sm leading-relaxed">{box.msg}</p>}
          <div className="flex gap-2 justify-end mt-6 flex-wrap">
            <Btn kind="ghost" onClick={() => { onClose(); box.onNo && box.onNo(); }}>{box.no || "Cancel"}</Btn>
            <Btn kind={box.danger ? "danger" : "primary"} onClick={() => { onClose(); box.onYes && box.onYes(); }}>{box.yes || "Confirm"}</Btn>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ───────── dashboard ───────── */
function Countdown({ date, time }) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const i = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(i); }, []);
  const d0 = pd(date);
  if (!d0) return null;
  const [h, m] = (time || "00:00").split(":").map(Number);
  d0.setHours(h || 0, m || 0, 0, 0);
  const ms = d0.getTime() - now;
  if (ms <= 0) return null;
  const parts = [[Math.floor(ms / 864e5), "days"], [Math.floor(ms / 36e5) % 24, "hrs"], [Math.floor(ms / 6e4) % 60, "min"], [Math.floor(ms / 1e3) % 60, "sec"]];
  return (
    <div>
      <div className="flex gap-2">
        {parts.map(([v, l]) => (
          <div key={l} className="text-center rounded-2xl px-2 py-2" style={{ background: "rgba(255,255,255,.12)", border: "1px solid rgba(255,255,255,.18)", minWidth: 56 }}>
            <div className="text-2xl font-medium num">{pad(v)}</div>
            <div className="text-xs uppercase tracking-wider" style={{ opacity: 0.7 }}>{l}</div>
          </div>
        ))}
      </div>
      <div className="text-xs mt-2" style={{ opacity: 0.75 }}>until the ceremony{time ? ` at ${fmtTime(time)}` : ""}</div>
    </div>
  );
}

function TaskLine({ task: x, onToggle, onOpen }) {
  const d = x.due ? diffDays(today(), x.due) : null;
  const late = !x.done && d !== null && d < 0;
  const soon = !x.done && d !== null && d >= 0 && d <= 3;
  return (
    <div className="wp-row flex items-start gap-3 px-2.5 py-2.5 rounded-xl">
      <button className={`wp-check ${x.done ? "on" : ""}`} onClick={onToggle} aria-label="Toggle done" style={{ marginTop: 1 }}>
        {x.done && <Ic n="Check" size={14} strokeWidth={3} />}
      </button>
      <button className="flex-1 min-w-0 text-left" onClick={onOpen}>
        <div className={`text-sm md:text-base leading-snug ${x.done ? "line-through wp-mut" : ""}`} style={{ fontWeight: 500 }}>{x.title}</div>
        <div className="flex flex-wrap items-center gap-x-2 gap-y-1 mt-1 text-xs wp-mut">
          {x.due && <span className="flex items-center gap-1" style={{ color: late ? "var(--red)" : soon ? "#A07A3C" : undefined, fontWeight: late || soon ? 600 : 400 }}><Ic n="Calendar" size={12} />{x.done ? fmtD(x.due) : relDay(x.due)}</span>}
          {x.cat && <span>{x.cat}</span>}
          {x.who && x.who !== "Both" && <span>· {x.who}</span>}
          {x.pri === "High" && !x.done && <span className="wp-chip" style={{ background: "var(--bl)", color: "var(--bd)", padding: "0 .45rem" }}>High</span>}
        </div>
        {x.notes && <div className="text-xs wp-mut mt-1 wp-clamp2">{x.notes}</div>}
      </button>
    </div>
  );
}

function Dashboard() {
  const { db, update, go, money, imgs, toast } = useApp();
  const s = db.settings, t = today();
  const daysTo = diffDays(t, s.date);
  const pending = db.tasks.filter((x) => !x.done).sort(byDue);
  const overdue = pending.filter((x) => x.due && x.due < t);
  const done = db.tasks.length - pending.length;
  const pct = db.tasks.length ? done / db.tasks.length : 0;
  const b = budgetStats(db.budget), g = guestStats(db.guests);
  const booked = db.vendors.filter((v) => v.status === "Booked");
  const payments = db.budget.items.filter((i) => i.due && cost(i) - num(i.paid) > 0).sort(byDue).slice(0, 4);
  const favs = db.mood.items.filter((i) => i.fav || i.final).slice(-6).reverse();
  const verse = daysTo === 0 ? VERSE_DAY : VERSES[Math.floor(Date.now() / 864e5) % VERSES.length];
  const bookedIn = (c) => db.vendors.find((v) => v.cat === c && v.status === "Booked");
  const toggle = (x) => { update("tasks", (ts) => ts.map((y) => (y.id === x.id ? { ...y, done: !y.done, doneAt: y.done ? null : Date.now() } : y))); if (!x.done) toast("Nice, one less thing to do ✓"); };
  const rows = [
    ["Ceremony format", PLANS[s.plan] || PLANS.undecided, s.plan !== "undecided"],
    s.plan !== "venue" && ["Church", bookedIn("Church") ? bookedIn("Church").name : "Not booked yet", !!bookedIn("Church")],
    ["Reception venue", bookedIn("Reception venue") ? bookedIn("Reception venue").name : "Not booked yet", !!bookedIn("Reception venue")],
    ["Marquee", bookedIn("Marquee hire") ? bookedIn("Marquee hire").name : "Not booked yet", !!bookedIn("Marquee hire")],
  ].filter(Boolean);
  return (
    <div className="space-y-4 md:space-y-5">
      <div className="wp-hero p-6 md:p-9">
        <Leaf className="wp-float" style={{ position: "absolute", right: -30, top: -20, width: 240, height: 240, color: "rgba(235,214,168,.4)" }} />
        <Leaf style={{ position: "absolute", left: -50, bottom: -60, width: 200, height: 200, color: "rgba(255,255,255,.13)", transform: "rotate(180deg)" }} />
        <div className="relative">
          <p className="text-xs uppercase tracking-widest gold">{s.plan === "church" ? "Church ceremony · Marquee reception" : s.plan === "venue" ? "Garden ceremony · Marquee reception" : "An outdoor marquee wedding"}</p>
          <h1 className="serif font-semibold mt-2 leading-none" style={{ fontSize: "clamp(2.4rem, 7vw, 4.2rem)" }}>{coupleName(s)}</h1>
          <p className="mt-3 text-sm md:text-base" style={{ opacity: 0.88 }}>{fmtLong(s.date)}{s.time ? ` · ${fmtTime(s.time)}` : ""}</p>
          <div className="mt-6 flex flex-wrap items-end gap-x-8 gap-y-5">
            {daysTo > 0 ? (
              <div>
                <div className="serif font-semibold leading-none gold num" style={{ fontSize: "clamp(4.5rem, 16vw, 7.5rem)" }}>{daysTo}</div>
                <div className="text-xs uppercase tracking-widest mt-1" style={{ opacity: 0.88 }}>{daysTo === 1 ? "day to go" : "days to go"}</div>
              </div>
            ) : (
              <div className="serif font-semibold gold" style={{ fontSize: "clamp(2.2rem,7vw,3.5rem)" }}>{daysTo === 0 ? "Today's the day! 💍" : `Married for ${-daysTo} days ♥`}</div>
            )}
            {daysTo >= 0 && <Countdown date={s.date} time={s.time} />}
            <div className="flex items-center gap-3 md:ml-auto">
              <Ring pct={pct} size={68}><span className="text-sm font-medium">{Math.round(pct * 100)}%</span></Ring>
              <div className="text-xs" style={{ opacity: 0.88 }}>planning<br />complete</div>
            </div>
          </div>
        </div>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
        <Stat icon="ListChecks" label="Tasks done" value={`${done}/${db.tasks.length}`} bar={pct} sub={overdue.length ? `${overdue.length} overdue` : `${pending.length} still to do`} warn={overdue.length > 0} onClick={() => go("tasks")} />
        <Stat icon="Wallet" tone="gold" label="Budget left" value={money(b.remaining)} bar={b.total ? b.committed / b.total : 0} sub={b.total ? `${Math.round((b.committed / b.total) * 100)}% allocated` : "Set your budget"} warn={b.remaining < 0} onClick={() => go("budget")} />
        <Stat icon="Users" tone="blush" label="Attending" value={g.yes} sub={`${g.invited} invited · ${g.pending} awaiting`} onClick={() => go("guests")} />
        <Stat icon="Store" label="Vendors booked" value={booked.length} sub={`${db.vendors.length} on your list`} onClick={() => go("vendors")} />
      </div>

      <div className="grid md:grid-cols-3 gap-4 md:gap-5">
        <Card className="p-4 md:p-5 md:col-span-2">
          <CardHead title="Up next" action="All tasks" onAction={() => go("tasks")} />
          {pending.length === 0 ? <Empty icon="Sparkles" title="All caught up" text="Every task is ticked off. Enjoy it!" /> : (
            <div>
              {overdue.length > 0 && <div className="wp-alert mb-2"><Ic n="AlertCircle|CircleAlert" size={16} />{overdue.length} task{overdue.length > 1 ? "s are" : " is"} overdue</div>}
              {pending.slice(0, 6).map((x) => <TaskLine key={x.id} task={x} onToggle={() => toggle(x)} onOpen={() => go("tasks")} />)}
            </div>
          )}
        </Card>
        <Card className="p-5">
          <CardHead title="Budget" action="Manage" onAction={() => go("budget")} />
          <div className="flex items-center gap-4">
            <Donut size={124} thick={14} parts={[{ v: b.paid, c: "#4F6E5C" }, { v: Math.max(0, b.committed - b.paid), c: "#B8955A" }, { v: Math.max(0, b.remaining), c: "#E4ECE6" }]}>
              <div className="text-xs wp-mut">left</div>
              <div className="serif text-xl font-semibold" style={{ color: b.remaining < 0 ? "var(--red)" : undefined }}>{b.total ? `${Math.round((Math.max(0, b.remaining) / b.total) * 100)}%` : "—"}</div>
            </Donut>
            <div className="flex-1 min-w-0 space-y-2 text-sm">
              <Legend c="#E4ECE6" border l="Total" v={money(b.total)} />
              <Legend c="#4F6E5C" l="Paid" v={money(b.paid)} />
              <Legend c="#B8955A" l="To pay" v={money(b.due)} />
              <div className="pt-2" style={{ borderTop: "1px solid var(--line)" }}><Legend l="Remaining" v={money(b.remaining)} strong red={b.remaining < 0} /></div>
            </div>
          </div>
        </Card>
        <Card className="p-5">
          <CardHead title="The plan" action="Venues" onAction={() => go("vendors")} />
          <div className="space-y-3">
            {rows.map(([l, v, ok]) => (
              <div key={l} className="flex items-start gap-3">
                <span className="wp-dot" style={{ background: ok ? "var(--sage)" : "#E8CD99" }}>{ok && <Ic n="Check" size={11} strokeWidth={3} color="#fff" />}</span>
                <div className="min-w-0"><div className="text-xs wp-mut">{l}</div><div className="text-sm font-medium">{v}</div></div>
              </div>
            ))}
          </div>
          {s.plan === "undecided" && <button className="text-sm mt-4 wp-link" onClick={() => go("settings")}>Set the ceremony format →</button>}
        </Card>
        <Card className="p-5">
          <CardHead title="Payments due" action="Budget" onAction={() => go("budget")} />
          {payments.length === 0 ? <p className="text-sm wp-mut">No payment dates yet. Add a due date to any budget item and it'll show up here.</p> : payments.map((i) => (
            <div key={i.id} className="flex items-center justify-between gap-2 py-2" style={{ borderBottom: "1px solid var(--line)" }}>
              <div className="min-w-0"><div className="text-sm font-medium truncate">{i.name}</div><div className="text-xs" style={{ color: i.due < t ? "var(--red)" : "var(--mut)" }}>{relDay(i.due)}</div></div>
              <div className="text-sm num font-medium">{money(cost(i) - num(i.paid))}</div>
            </div>
          ))}
        </Card>
        <Card className="p-6 flex flex-col justify-center" style={{ background: "linear-gradient(160deg,#FFFFFF,#F7EFE3)" }}>
          <Ic n="Heart" size={18} color="#C4847C" fill="#EBCBC5" />
          <p className="serif text-xl md:text-2xl italic leading-snug mt-3">“{verse[0]}”</p>
          <p className="text-xs uppercase tracking-widest wp-mut mt-3">{verse[1]}</p>
        </Card>
        <Card className="p-5 md:col-span-3">
          <CardHead title="Loved ideas" action="Moodboard" onAction={() => go("mood")} />

            <div className="flex items-center gap-4 flex-wrap"><p className="text-sm wp-mut flex-1">Tap the heart on moodboard images and your favourites will gather here.</p><Btn kind="soft" onClick={() => go("mood")}><Ic n="Image" size={16} />Open moodboard</Btn></div>
          ) : (
            <div className="grid grid-cols-3 md:grid-cols-6 gap-2">
              {favs.map((i) => { const src = i.hasImg ? imgs[i.id] : i.url; return (
                <button key={i.id} className="wp-sq rounded-xl overflow-hidden relative" style={{ background: "#EFEAE1" }} onClick={() => go("mood")}>
                  {src && src !== "missing" && <img src={src} alt="" style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover" }} />}
                </button>
              ); })}

          )}

      </div>

}

/* ───────── tasks ───────── */
function Tasks() {
  const { db, update, toast } = useApp();
  const [filter, setFilter] = useState("pending");
  const [q, setQ] = useState("");
  const [cat, setCat] = useState("All");
  const [who, setWho] = useState("All");
  const [edit, setEdit] = useState(null);
  const [quick, setQuick] = useState("");
  const [quickDate, setQuickDate] = useState("");
  const t = today();
  const list = db.tasks.filter((x) => (cat === "All" || x.cat === cat) && (who === "All" || x.who === who) && (!q || `${x.title} ${x.notes || ""}`.toLowerCase().includes(q.toLowerCase())));
  const pend = list.filter((x) => !x.done).sort(byDue);
  const doneL = list.filter((x) => x.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  const groups = filter === "done" ? [["Completed", doneL]] : filter === "overdue" ? [["Overdue", pend.filter((x) => x.due && x.due < t)]] : filter === "all" ? [...groupPending(pend, t), ["Completed", doneL]] : groupPending(pend, t);
  const toggle = (x) => { update("tasks", (ts) => ts.map((y) => (y.id === x.id ? { ...y, done: !y.done, doneAt: y.done ? null : Date.now() } : y))); if (!x.done) toast("Done ✓"); };
  const addQuick = (e) => {
    e.preventDefault();
    if (!quick.trim()) return;
    update("tasks", (ts) => [...ts, { id: uid(), title: quick.trim(), notes: "", due: quickDate, cat: cat !== "All" ? cat : "Planning", who: "Both", pri: "Medium", done: false }]);
    setQuick(""); setQuickDate(""); toast("Task added");
  };
  const doneN = db.tasks.filter((x) => x.done).length;
  const odN = db.tasks.filter((x) => !x.done && x.due && x.due < t).length;
  return (
    <div>
      <PageHead title="Tasks" sub={`${doneN} of ${db.tasks.length} done${odN ? ` · ${odN} overdue` : ""}`}>
        <Btn onClick={() => setEdit({})}><Ic n="Plus" size={16} />New task</Btn>
      </PageHead>
      <Card className="p-3 mb-4">
        <form onSubmit={addQuick} className="flex gap-2 items-center">
          <input className="wp-input flex-1 min-w-0" placeholder="Quick add a task…" value={quick} onChange={(e) => setQuick(e.target.value)} />
          <input type="date" className="wp-input" style={{ width: 138, flexShrink: 0 }} value={quickDate} onChange={(e) => setQuickDate(e.target.value)} aria-label="Estimated date" />
          <button type="submit" className="wp-icon-btn" style={{ background: "var(--sd)", color: "#fff" }} aria-label="Add"><Ic n="Plus" /></button>
        </form>
      </Card>
      <div className="flex flex-wrap items-center gap-2 mb-4">
        <div className="wp-scroll-x" style={{ maxWidth: "100%" }}><Seg value={filter} onChange={setFilter} options={[["pending", "To do"], ["overdue", `Overdue${odN ? ` · ${odN}` : ""}`], ["done", "Done"], ["all", "All"]]} /></div>
        <div className="relative flex-1" style={{ minWidth: 170 }}>
          <span className="absolute" style={{ left: 12, top: 12, color: "var(--mut)" }}><Ic n="Search" size={16} /></span>
          <input className="wp-input" style={{ paddingLeft: 36 }} placeholder="Search tasks & notes" value={q} onChange={(e) => setQ(e.target.value)} />
        </div>
        <select className="wp-input" style={{ width: "auto" }} value={cat} onChange={(e) => setCat(e.target.value)}><option value="All">All categories</option>{TASK_CATS.map((c) => <option key={c}>{c}</option>)}</select>
        <select className="wp-input" style={{ width: "auto" }} value={who} onChange={(e) => setWho(e.target.value)}><option value="All">Everyone</option>{WHO.map((c) => <option key={c}>{c}</option>)}</select>
      </div>
      {groups.every(([, a]) => !a.length) ? (
        <Card><Empty icon="ListChecks" title="Nothing here" text={q ? "No tasks match your search." : filter === "overdue" ? "No overdue tasks. Nice work!" : filter === "done" ? "Tick off a task and it'll land here." : "Add a task above to get started."} /></Card>
      ) : groups.filter(([, a]) => a.length).map(([label, arr]) => (
        <div key={label} className="mb-5">
          <div className="flex items-center gap-2 mb-2 px-1">
            <h3 className="text-xs uppercase tracking-widest font-semibold" style={{ color: label === "Overdue" ? "var(--red)" : "var(--mut)" }}>{label}</h3>
            <span className="text-xs wp-mut">{arr.length}</span>
          </div>
          <Card className="p-1.5 md:p-2">{arr.map((x) => <TaskLine key={x.id} task={x} onToggle={() => toggle(x)} onOpen={() => setEdit(x)} />)}</Card>
        </div>
      ))}
      {edit && <TaskModal task={edit} onClose={() => setEdit(null)} />}
    </div>
  );
}

function TaskModal({ task, onClose }) {
  const { update, ask, toast } = useApp();
  const isNew = !task.id;
  const [f, setF] = useState({ title: "", notes: "", due: "", cat: "Planning", who: "Both", pri: "Medium", done: false, ...task });
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const save = () => {
    if (!f.title.trim()) return toast("Give the task a name");
    const rec = { ...f, title: f.title.trim() };
    update("tasks", (ts) => (isNew ? [...ts, { ...rec, id: uid() }] : ts.map((x) => (x.id === task.id ? rec : x))));
    toast(isNew ? "Task added" : "Task saved");
    onClose();
  };
  const del = () => ask({ title: "Delete this task?", msg: f.title, yes: "Delete", danger: true, onYes: () => { update("tasks", (ts) => ts.filter((x) => x.id !== task.id)); toast("Task deleted"); onClose(); } });
  return (
    <Modal onClose={onClose} title={isNew ? "New task" : "Edit task"} footer={<>
      {!isNew && <Btn kind="danger" onClick={del}><Ic n="Trash2" size={15} />Delete</Btn>}
      <div className="flex-1" />
      <Btn kind="ghost" onClick={onClose}>Cancel</Btn>
      <Btn onClick={save}>{isNew ? "Add task" : "Save"}</Btn>
    </>}>
      <div className="space-y-4">
        <Field label="Task"><input className="wp-input" value={f.title} onChange={set("title")} placeholder="e.g. Book the photographer" /></Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Estimated date"><input type="date" className="wp-input" value={f.due || ""} onChange={set("due")} /></Field>
          <Field label="Category"><select className="wp-input" value={f.cat} onChange={set("cat")}>{TASK_CATS.map((c) => <option key={c}>{c}</option>)}</select></Field>
          <Field label="Who's on it"><select className="wp-input" value={f.who} onChange={set("who")}>{WHO.map((c) => <option key={c}>{c}</option>)}</select></Field>
          <Field label="Priority"><select className="wp-input" value={f.pri} onChange={set("pri")}>{PRI.map((c) => <option key={c}>{c}</option>)}</select></Field>
        </div>
        <Field label="Notes"><textarea className="wp-input" rows={5} value={f.notes} onChange={set("notes")} placeholder="Contacts, prices, questions to ask, ideas…" /></Field>
        {!isNew && (
          <button type="button" className="flex items-center gap-2 text-sm" onClick={() => setF({ ...f, done: !f.done, doneAt: f.done ? null : Date.now() })}>
            <span className={`wp-check ${f.done ? "on" : ""}`}>{f.done && <Ic n="Check" size={14} strokeWidth={3} />}</span>{f.done ? "Completed" : "Mark as done"}
          </button>
        )}
      </div>
    </Modal>
  );
}

/* ───────── budget ───────── */
const payState = (i) => {
  const c = cost(i), p = num(i.paid);
  if (c <= 0) return ["Needs price", "#F1EEE8", "var(--mut)"];
  if (p >= c) return ["Paid", "var(--sl)", "var(--sd)"];
  if (p > 0) return ["Deposit paid", "var(--gl)", "var(--gd)"];
  return ["Unpaid", "#F1EEE8", "#6B7570"];
};

function Budget() {
  const { db, update, money, toast } = useApp();
  const b = budgetStats(db.budget);
  const [edit, setEdit] = useState(null);
  const [fund, setFund] = useState(null);
  const [filter, setFilter] = useState("all");
  const cats = Object.entries(b.byCat).filter(([, v]) => v > 0).sort((a, z) => z[1] - a[1]);
  const items = db.budget.items.filter((i) => filter === "all" || (filter === "unpaid" ? cost(i) === 0 || cost(i) - num(i.paid) > 0 : cost(i) > 0 && num(i.paid) >= cost(i)));
  const ord = (c) => { const k = BUDGET_CATS.indexOf(c); return k < 0 ? 99 : k; };
  const groups = [...new Set(items.map((i) => i.cat || "Other"))].sort((a, z) => ord(a) - ord(z)).map((c) => [c, items.filter((i) => (i.cat || "Other") === c)]);

  return (
    <div>
      <PageHead title="Budget" sub="Every cost you add comes straight off what's left.">

      <Card className="p-5 md:p-7 mb-4">

            <div className="text-sm wp-mut mt-1">{b.total ? `of ${money(b.total)} total budget` : "Add a budget source to set your total"}</div>

              {[["Allocated", b.committed, "var(--gold)"], ["Paid", b.paid, "var(--sd)"], ["Still to pay", b.due, null]].map(([l, v, c]) => (
                <div key={l} className="min-w-0">
                  <div className="text-xs wp-mut flex items-center gap-1">{c && <span style={{ width: 8, height: 8, borderRadius: 2, background: c }} />}{l}</div>
                  <div className="font-medium num text-sm md:text-base truncate">{money(v)}</div>

              {cats.length === 0 && <p className="text-sm wp-mut">Spending by category will show here.</p>}

                <div key={c} className="flex items-center gap-2 text-sm">
                  <span style={{ width: 9, height: 9, borderRadius: 3, background: catColor(c), flexShrink: 0 }} />

                <Btn kind="ghost" onClick={() => setEdit({})}>Add my own</Btn>

              <div key={c} className="mb-2">
                <div className="flex items-center justify-between px-3 py-2 text-xs uppercase tracking-wider wp-mut">
                  <span className="flex items-center gap-2"><span style={{ width: 8, height: 8, borderRadius: 2, background: catColor(c) }} />{c}</span>

                {arr.map((i) => { const [st, bg, fg] = payState(i); const c2 = cost(i); return (
                  <button key={i.id} className="wp-row w-full text-left flex items-center gap-3 px-3 py-2.5 rounded-xl" onClick={() => setEdit(i)}>
                    <div className="flex-1 min-w-0">
                      <div className="font-medium truncate">{i.name}</div>
                      <div className="text-xs wp-mut truncate">{[i.vendor, num(i.actual) > 0 ? "Confirmed price" : c2 ? "Estimate" : null, i.due && c2 - num(i.paid) > 0 ? `Due ${fmtD(i.due)}` : null].filter(Boolean).join(" · ") || "Tap to add a price"}</div>
                      {c2 > 0 && <div className="mt-2" style={{ maxWidth: 220 }}><Bar h={4} v={num(i.paid) / c2} /></div>}
                    </div>
                    <div className="text-right flex-shrink-0">
                      <div className="font-medium num">{c2 ? money(c2) : "—"}</div>
                      <span className="wp-chip mt-1" style={{ background: bg, color: fg }}>{st}</span>
                    </div>
                  </button>
                ); })}

          </Card>
        </div>
      </div>
      {edit && <ExpenseModal item={edit} onClose={() => setEdit(null)} />}
      {fund && <FundModal fund={fund} onClose={() => setFund(null)} />}
    </div>
  );
}

function Calc({ remaining, onFund, onExpense }) {
  const { money, toast } = useApp();
  const [e, setE] = useState("");
  const [label, setLabel] = useState("");
  const val = evalExpr(e);
  const press = (k) => {
    if (k === "C") return setE("");
    if (k === "⌫") return setE((x) => x.slice(0, -1));
    if (k === "=") { if (val !== null) setE(val < 0 ? "−" + fmtPlain(-val) : fmtPlain(val)); return; }
    setE((x) => {
      const last = x.slice(-1);
      if (OPS.includes(k)) {
        if (!x) return k === "−" ? "−" : x;
        if (OPS.includes(last)) return x.length === 1 ? x : x.slice(0, -1) + k;
        return x + k;
      }
      const seg = x.split(/[+−×÷]/).pop();
      if (k === ".") return seg.includes(".") ? x : x + (seg ? "." : "0.");
      if (seg.replace(".", "").length >= 12) return x;
      return x + k;
    });
  };
  const onKey = (ev) => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
    const map = { "+": "+", "-": "−", "*": "×", x: "×", "/": "÷", Enter: "=", "=": "=", Backspace: "⌫", Escape: "C", Delete: "C", ".": ".", ",": "." };
    const k = /^[0-9]$/.test(ev.key) ? ev.key : map[ev.key];
    if (k) { ev.preventDefault(); press(k); }
  };
  const act = (type) => {
    if (!(val > 0)) return toast("Enter an amount on the calculator first");
    const amt = Math.round(val * 100) / 100;
    if (type === "exp") onExpense(label.trim(), amt);
    else onFund(label.trim() || (type === "add" ? "Added funds" : "Budget reduction"), type === "add" ? amt : -amt);
    setE(""); setLabel("");
  };
  const keys = ["C", "⌫", "÷", "×", "7", "8", "9", "−", "4", "5", "6", "+", "1", "2", "3", "=", "0", "."];
  return (
    <Card className="p-4 md:p-5">
      <div tabIndex={0} onKeyDown={onKey} style={{ outline: "none" }}>
        <div className="flex items-center justify-between mb-3">
          <h3 className="serif text-2xl font-semibold flex items-center gap-2"><Ic n="Calculator" size={20} />Calculator</h3>
          <button className="text-xs wp-link" onClick={() => setE(remaining < 0 ? "−" + fmtPlain(-remaining) : fmtPlain(remaining))}>Use remaining</button>
        </div>
        <div className="wp-screen">
          <div className="text-right text-sm num" style={{ opacity: 0.65, minHeight: 20, wordBreak: "break-all" }}>{e || " "}</div>
          <div className="text-right serif font-semibold num truncate" style={{ fontSize: "2.4rem", lineHeight: 1.1 }}>{val !== null ? fmtNum(val) : "0"}</div>
        </div>
        {val > 0 && (
          <div className="grid grid-cols-2 gap-2 text-xs mt-2">
            <div className="rounded-xl px-3 py-2" style={{ background: "var(--rl)" }}>If spent: <b className="num">{money(remaining - val)}</b> left</div>
            <div className="rounded-xl px-3 py-2" style={{ background: "var(--sl)" }}>If added: <b className="num">{money(remaining + val)}</b> left</div>
          </div>
        )}
        <div className="grid grid-cols-4 gap-2 mt-3">
          {keys.map((k) => (
            <button key={k} className={`wp-key ${OPS.includes(k) ? "op" : ""} ${k === "=" ? "eq" : ""} ${k === "C" || k === "⌫" ? "fn" : ""}`} style={k === "=" ? { gridRow: "span 2", height: "auto" } : k === "0" ? { gridColumn: "span 2" } : undefined} onClick={() => press(k)} aria-label={k === "⌫" ? "Backspace" : k}>
              {k === "⌫" ? <Ic n="Delete" size={19} /> : k}
            </button>
          ))}
        </div>
        <input className="wp-input mt-3" placeholder="What's it for? (optional)" value={label} onChange={(ev) => setLabel(ev.target.value)} />
        <div className="grid grid-cols-3 gap-2 mt-2">
          <Btn kind="soft" className="wp-btn-sm" onClick={() => act("add")}><Ic n="Plus" size={14} />Budget</Btn>
          <Btn kind="ghost" className="wp-btn-sm" onClick={() => act("sub")}><Ic n="Minus" size={14} />Budget</Btn>
          <Btn className="wp-btn-sm" onClick={() => act("exp")}><Ic n="Plus" size={14} />Expense</Btn>
        </div>

function useAddFiles() {
  const { update, saveImg } = useApp();
  return async (files, board, caption, onProgress) => {
    const list = Array.from(files || []).filter((f) => /^image\//.test(f.type) || /\.(jpe?g|png|webp|gif|heic|heif|avif)$/i.test(f.name));
    let ok = 0;
    for (let n = 0; n < list.length; n++) {
      onProgress && onProgress(n + 1, list.length);
      try {
        const data = await compressImage(list[n]);
        const id = uid();
        if (await saveImg(id, data)) {
          const item = { id, board, hasImg: true, caption: list.length === 1 ? (caption || "").trim() : "", fav: false, final: false, added: Date.now() };
          update("mood", (m) => ({ ...m, items: [...m.items, item] }));
          ok++;
        }
      } catch (e) { /* unreadable file, skip */ }
    }
    return { ok, total: list.length };
  };
}

function Lightbox({ id, setId, onClose }) {
  const { db, update, imgs, delImg, ask, toast } = useApp();
  const m = db.mood;
  const i = m.items.find((x) => x.id === id);
  const sibs = i ? [...m.items.filter((x) => x.board === i.board)].reverse() : [];
  const idx = sibs.findIndex((x) => x.id === id);
  const step = (d) => { if (sibs.length > 1) setId(sibs[(idx + d + sibs.length) % sibs.length].id); };
  useEffect(() => {
    const k = (e) => { if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return; if (e.key === "Escape") onClose(); if (e.key === "ArrowRight") step(1); if (e.key === "ArrowLeft") step(-1); };
    window.addEventListener("keydown", k);
    document.body.style.overflow = "hidden";
    return () => { window.removeEventListener("keydown", k); document.body.style.overflow = ""; };
  });
  useEffect(() => { if (!i) onClose(); }, [i]);
  if (!i) return null;
  const patch = (p) => update("mood", (mm) => ({ ...mm, items: mm.items.map((x) => (x.id === id ? { ...x, ...p } : x)) }));
  const src = i.hasImg ? imgs[i.id] : i.url;
  const del = () => ask({ title: "Remove this image?", yes: "Remove", danger: true, onYes: () => {
    const next = sibs.length > 1 ? sibs[(idx + 1) % sibs.length].id : null;
    update("mood", (mm) => ({ ...mm, items: mm.items.filter((x) => x.id !== id) }));
    if (i.hasImg) delImg(i.id);
    toast("Image removed");
    next ? setId(next) : onClose();
  } });
  return (
    <div className="wp-lightbox">
      <div className="flex-1 relative flex items-center justify-center p-4" style={{ minHeight: 0 }} onClick={(e) => e.target === e.currentTarget && onClose()}>
        {src && src !== "missing" ? <img src={src} alt={i.caption || ""} style={{ maxWidth: "100%", maxHeight: "100%", objectFit: "contain", borderRadius: 12 }} /> : <div className="text-sm" style={{ color: "rgba(255,255,255,.7)" }}>Image unavailable</div>}
        <button className="wp-lb-btn" style={{ top: 14, right: 14 }} onClick={onClose} aria-label="Close"><Ic n="X" /></button>
        {sibs.length > 1 && <>
          <button className="wp-lb-btn" style={{ left: 14, top: "50%", transform: "translateY(-50%)" }} onClick={() => step(-1)} aria-label="Previous"><Ic n="ChevronLeft" /></button>
          <button className="wp-lb-btn" style={{ right: 14, top: "50%", transform: "translateY(-50%)" }} onClick={() => step(1)} aria-label="Next"><Ic n="ChevronRight" /></button>
        </>}
      </div>
      <div className="wp-lb-panel">
        <div className="flex items-center gap-2 mb-3">
          <span className="text-xs wp-mut flex-1">{idx + 1} of {sibs.length}</span>
          <button className={`wp-btn wp-btn-sm ${i.fav ? "wp-btn-blush" : "wp-btn-ghost"}`} onClick={() => patch({ fav: !i.fav })}><Ic n="Heart" size={14} fill={i.fav ? "currentColor" : "none"} />{i.fav ? "Loved" : "Love"}</button>
          <button className={`wp-btn wp-btn-sm ${i.final ? "wp-btn-primary" : "wp-btn-ghost"}`} onClick={() => patch({ final: !i.final })}><Ic n="Check" size={14} />{i.final ? "Final pick" : "Make final"}</button>
        </div>
        <div className="space-y-3">
          <Field label="Caption"><input className="wp-input" value={i.caption || ""} onChange={(e) => patch({ caption: e.target.value })} placeholder="Add a caption" /></Field>
          <Field label="Notes"><textarea className="wp-input" rows={3} value={i.notes || ""} onChange={(e) => patch({ notes: e.target.value })} placeholder="Where it's from, price, what you love about it…" /></Field>
          <Field label="Board"><select className="wp-input" value={i.board} onChange={(e) => patch({ board: e.target.value })}>{m.boards.map((b) => <option key={b.id} value={b.id}>{b.emoji} {b.name}</option>)}</select></Field>
          <Btn kind="danger" className="w-full" onClick={del}><Ic n="Trash2" size={15} />Remove image</Btn>
        </div>
      </div>
    </div>
  );
}

function BulkGuests({ onClose }) {

/* ───────── error safety net ───────── */
class Boundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err) { console.error(err); }
  render() {
    if (!this.state.err) return this.props.children;
    return (
      <div className="wp flex items-center justify-center p-6" style={{ minHeight: "100vh" }}>
        <style>{CSS}</style><div className="wp-bg" />
        <div className="wp-card p-6 text-center" style={{ maxWidth: 420 }}>
          <div style={{ fontSize: 40 }}>💍</div>
          <div className="serif text-3xl font-semibold mt-2">Something went wrong</div>
          <p className="text-sm wp-mut mt-2">Anything already saved is safe. Refresh the page to carry on.</p>
          <p className="text-xs wp-mut mt-2" style={{ wordBreak: "break-word" }}>{String((this.state.err && this.state.err.message) || this.state.err)}</p>
          <button className="wp-btn wp-btn-primary mt-4" onClick={() => location.reload()}>Refresh</button>
        </div>
      </div>
    );
  }
}

function WeddingPlanner() {
  const [db, setDb] = useState(null);
  const dbRef = useRef(null);
  const [sync, setSync] = useState("loading");
  const [loadErr, setLoadErr] = useState(false);
  const [view, setView] = useState("home");
  const [more, setMore] = useState(false);
  const [toastMsg, setToastMsg] = useState(null);
  const [confirmBox, setConfirmBox] = useState(null);
  const [imgs, setImgs] = useState({});
  const R = useRef({ canWrite: false, dirty: {}, timers: {}, last: {} });
  const tRef = useRef(null);
  const loadingImgs = useRef(new Set());

  const toast = (m) => { setToastMsg({ m, k: Date.now() }); clearTimeout(tRef.current); tRef.current = setTimeout(() => setToastMsg(null), 2600); };
  const ask = (o) => setConfirmBox(o);
  const refreshStatus = () => { if (R.current.canWrite) setSync(Object.values(R.current.dirty).some(Boolean) ? "saving" : "saved"); };

  const flush = async (sec) => {
    const st = store(), r = R.current;
    if (!st || !r.canWrite) return;
    clearTimeout(r.timers[sec]);
    const json = JSON.stringify(dbRef.current[sec]);
    try {
      const res = await st.set(KEYS[sec], json, true);
      if (!res) throw new Error("save failed");
      r.last[sec] = json;
      if (JSON.stringify(dbRef.current[sec]) === json) r.dirty[sec] = false;
      refreshStatus();
    } catch (e) { setSync("error"); }
  };
  const schedule = (sec) => {
    const r = R.current;
    r.dirty[sec] = true;
    clearTimeout(r.timers[sec]);
    r.timers[sec] = setTimeout(() => flush(sec), 700);
    if (r.canWrite) setSync("saving");
  };
  const update = (sec, fn) => {
    const val = typeof fn === "function" ? fn(dbRef.current[sec]) : fn;
    dbRef.current = { ...dbRef.current, [sec]: val };
    setDb(dbRef.current);
    schedule(sec);
  };
  const replaceAll = (data) => { dbRef.current = data; setDb(data); Object.keys(KEYS).forEach(schedule); };

  const load = async () => {
    const st = store(), data = {}, missing = [];
    if (!st) { Object.keys(KEYS).forEach((k) => { data[k] = FRESH[k](); }); dbRef.current = data; setDb(data); setSync("local"); return; }
    let vals = null;
    for (let i = 0; i < 3 && !vals; i++) {
      try { vals = await readAll(st); } catch (e) { await sleep(700); }
    }
    if (vals) {
      Object.entries(KEYS).forEach(([sec, key]) => {
        const v = vals[key];
        if (typeof v === "string") {
          try { data[sec] = normalize(sec, JSON.parse(v)); R.current.last[sec] = v; } catch (e) { missing.push(sec); }
        } else missing.push(sec);
      });
    }
    Object.keys(KEYS).forEach((k) => { if (!data[k]) data[k] = FRESH[k](); });
    dbRef.current = data; setDb(data);
    if (!vals) { setLoadErr(true); setSync("error"); return; }
    setLoadErr(false);
    R.current.canWrite = true; setSync("saved");
    missing.forEach((sec) => sec !== "settings" && schedule(sec));
  };

  const pull = async (manual) => {
    const st = store(), r = R.current;
    if (!st) { if (manual) toast("Saving isn't available in this preview"); return; }
    if (!r.canWrite) { if (manual) { setSync("loading"); await load(); } return; }
    const secs = Object.keys(KEYS);
    for (const sec of secs) if (r.dirty[sec]) await flush(sec);
    let vals;
    try {
      const want = secs.filter((sec) => !r.dirty[sec]).map((sec) => KEYS[sec]);
      if (st.getMany) vals = await st.getMany(want);
      else { vals = {}; for (const k of want) { const res = await st.get(k, true); vals[k] = res && res.value; } }
    } catch (e) { if (manual) toast("Couldn't reach your saved plans. Try again in a moment"); return; }
    for (const sec of secs) {
      const v = vals[KEYS[sec]];
      if (typeof v === "string" && v !== r.last[sec] && !r.dirty[sec]) {
        try { const parsed = normalize(sec, JSON.parse(v)); r.last[sec] = v; dbRef.current = { ...dbRef.current, [sec]: parsed }; } catch (e) { /* ignore bad data */ }
      }
    }
    setDb(dbRef.current);
    if (manual) toast("Up to date ✓");
  };

  const saveImg = async (id, data) => {
    setImgs((p) => ({ ...p, [id]: data }));
    const st = store();
    if (!st || !R.current.canWrite) return true;
    try { return !!(await st.set(IMGK(id), data, true)); } catch (e) { return false; }
  };
  const delImg = async (id) => {
    setImgs((p) => { const n = { ...p }; delete n[id]; return n; });
    const st = store();
    if (st && R.current.canWrite) { try { await st.delete(IMGK(id), true); } catch (e) { /* ignore */ } }
  };
  const resetAll = async () => {
    const st = store();
    if (st && R.current.canWrite) {
      try { const r = await st.list(PFX, true); const ks = ((r && r.keys) || []).map((k) => (typeof k === "string" ? k : k.key)); for (const k of ks) { try { await st.delete(k, true); } catch (e) { /* ignore */ } } } catch (e) { /* ignore */ }
    }
    R.current.last = {}; R.current.dirty = {};
    const data = {}; Object.keys(KEYS).forEach((k) => { data[k] = FRESH[k](); });
    dbRef.current = data; setDb(data); setImgs({}); loadingImgs.current = new Set();
    Object.keys(KEYS).filter((k) => k !== "settings").forEach(schedule);
    setView("home"); toast("Planner reset");
  };

  useEffect(() => { load(); }, []);
  useEffect(() => {
    if (!db) return;
    const iv = setInterval(() => { if (!document.hidden) pull(false); }, 60000);
    const onVis = () => { if (document.hidden) Object.keys(KEYS).forEach((k) => R.current.dirty[k] && flush(k)); else pull(false); };
    document.addEventListener("visibilitychange", onVis);
    return () => { clearInterval(iv); document.removeEventListener("visibilitychange", onVis); };
  }, [!!db]);
  useEffect(() => {
    if (!db) return;
    const st = store();
    if (!st) return;
    const queue = db.mood.items.filter((i) => i.hasImg && imgs[i.id] === undefined && !loadingImgs.current.has(i.id)).map((i) => i.id);
    if (!queue.length) return;
    queue.forEach((id) => loadingImgs.current.add(id));
    const worker = async () => {
      while (queue.length) {
        const id = queue.shift();
        try { const r = await st.get(IMGK(id), true); setImgs((p) => ({ ...p, [id]: r && r.value ? r.value : "missing" })); }
        catch (e) { setImgs((p) => ({ ...p, [id]: "missing" })); }
      }
    };
    worker(); worker(); worker();
  }, [db && db.mood.items]);
  useEffect(() => { if (db) document.title = `${coupleName(db.settings)} · Wedding Planner`; }, [db && db.settings]);

  if (!db) return (
    <div className="wp flex items-center justify-center" style={{ minHeight: "100vh" }}>
      <style>{CSS}</style><div className="wp-bg" />
      <div className="text-center"><div className="wp-float" style={{ fontSize: 46 }}>💍</div><div className="serif text-3xl font-semibold mt-3">Opening your planner…</div></div>
    </div>
  );

  const s = db.settings;
  const daysTo = diffDays(today(), s.date);
  const overdueN = db.tasks.filter((x) => !x.done && x.due && x.due < today()).length;
  const go = (v) => { setView(v); setMore(false); try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch (e) { window.scrollTo(0, 0); } };
  const ctx = { db, update, toast, ask, go, money: (n) => money(n, s.currency), imgs, saveImg, delImg, pull, sync, replaceAll, resetAll };
  const V = { home: <Dashboard />, tasks: <Tasks />, budget: <Budget />, mood: <Mood />, guests: <Guests />, vendors: <Vendors />, day: <DayPlan />, settings: <SettingsView /> };
  const daysLabel = daysTo > 0 ? `${daysTo} day${daysTo === 1 ? "" : "s"} to go` : daysTo === 0 ? "Today's the day!" : "Married ♥";
  const headIcon = sync === "error" || sync === "local" ? "CloudOff" : sync === "saving" || sync === "loading" ? "RefreshCw" : isLocal() ? "HardDrive|Save" : "Cloud";

  return (
    <Ctx.Provider value={ctx}>
      <div className="wp">
        <style>{CSS}</style>
        <div className="wp-bg" />
        <aside className="wp-side hidden md:flex flex-col">
          <div className="px-6 pt-7 pb-6">
            <div className="text-xs uppercase tracking-widest" style={{ color: "var(--gold)" }}>Wedding planner</div>
            <div className="serif text-3xl font-semibold leading-tight mt-1">{coupleName(s)}</div>
            <div className="text-sm wp-mut mt-1">{fmtD(s.date, { day: "numeric", month: "long", year: "numeric" })}</div>
          </div>
          <nav className="px-3 flex flex-col gap-1">
            {NAV.map((n) => (
              <button key={n.id} className={`wp-nav-item ${view === n.id ? "on" : ""}`} onClick={() => go(n.id)}>
                <Ic n={n.icon} size={18} /><span className="flex-1">{n.label}</span>
                {n.id === "tasks" && overdueN > 0 && <span className="wp-badge">{overdueN}</span>}
              </button>
            ))}
          </nav>
          <div className="mt-auto p-4">
            <div className="rounded-2xl p-4 mb-3 relative overflow-hidden" style={{ background: "linear-gradient(135deg,#3B5647,#7E9C88)", color: "#FBF6EC" }}>
              <Leaf style={{ position: "absolute", right: -20, bottom: -30, width: 110, height: 110, color: "rgba(235,214,168,.35)" }} />
              <div className="serif text-4xl font-semibold leading-none relative" style={{ color: "#EBD6A8" }}>{daysTo > 0 ? daysTo : "♥"}</div>
              <div className="text-xs uppercase tracking-widest mt-1 relative" style={{ opacity: 0.88 }}>{daysTo > 0 ? (daysTo === 1 ? "day to go" : "days to go") : daysLabel}</div>
            </div>
            <SyncBadge />
          </div>
        </aside>

        <header className="md:hidden sticky top-0 z-30 flex items-center justify-between gap-3 px-4 py-3" style={{ background: "rgba(250,247,242,.9)", backdropFilter: "blur(12px)", WebkitBackdropFilter: "blur(12px)", borderBottom: "1px solid var(--line)" }}>
          <div className="min-w-0"><div className="serif text-xl font-semibold truncate leading-tight">{coupleName(s)}</div><div className="text-xs" style={{ color: "var(--gold)" }}>{daysLabel}</div></div>
          <button onClick={() => pull(true)} className="wp-icon-btn" aria-label="Sync" style={{ color: sync === "error" || sync === "local" ? "var(--red)" : sync === "saving" ? "#A07A3C" : "var(--sd)" }}>
            <Ic n={headIcon} size={18} className={sync === "saving" ? "wp-spin" : ""} />
          </button>
        </header>

        <main className="md:ml-64">
          <div className="max-w-6xl mx-auto px-4 md:px-8 pt-4 md:pt-8 pb-32 md:pb-12">
            {loadErr && <div className="wp-alert mb-4 flex-wrap"><Ic n="CloudOff" size={16} /><span className="flex-1">Couldn't reach your saved plans, so changes won't be saved right now.</span><button className="font-medium underline" onClick={() => pull(true)}>Retry</button></div>}
            <div key={view} className="wp-fade">{V[view]}</div>
          </div>
        </main>

        <nav className="wp-bottom md:hidden flex">
          {MOBILE_MAIN.map((id) => { const n = NAV.find((x) => x.id === id); return (
            <button key={id} className={`wp-tab ${view === id ? "on" : ""}`} onClick={() => go(id)}>
              <span className="relative"><Ic n={n.icon} size={21} />{id === "tasks" && overdueN > 0 && <span style={{ position: "absolute", top: -2, right: -4, width: 8, height: 8, borderRadius: 99, background: "var(--red)" }} />}</span>
              <span>{n.short}</span>
            </button>
          ); })}
          <button className={`wp-tab ${!MOBILE_MAIN.includes(view) ? "on" : ""}`} onClick={() => setMore(true)}><Ic n="MoreHorizontal|Ellipsis" size={21} /><span>More</span></button>
        </nav>

        {more && (
          <Modal onClose={() => setMore(false)} title="More">
            <div className="grid grid-cols-2 gap-3 pb-2">
              {NAV.filter((n) => !MOBILE_MAIN.includes(n.id)).map((n) => (
                <button key={n.id} className="wp-card hov p-4 text-left flex flex-col gap-3" style={view === n.id ? { borderColor: "var(--sage)" } : undefined} onClick={() => go(n.id)}>
                  <span className="wp-ico"><Ic n={n.icon} size={16} /></span><span className="font-medium text-sm">{n.label}</span>
                </button>
              ))}
            </div>
          </Modal>
        )}
        {!s.setupDone && <Setup />}
        <Confirm box={confirmBox} onClose={() => setConfirmBox(null)} />
        {toastMsg && <div key={toastMsg.k} className="wp-toast">{toastMsg.m}</div>}
      </div>
    </Ctx.Provider>
  );
}

/* ───────── start ───────── */
window.plannerReady.then(() => {
  const el = document.getElementById("root");
  el.innerHTML = "";
  ReactDOM.createRoot(el).render(<Boundary><WeddingPlanner /></Boundary>);
});
})();
</script>
</body>
</html>
